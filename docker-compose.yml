services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_NAME:-tbl}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_PASS:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DOCKER_DB_NAME:-tbl}
      DB_USER: root
      DB_PASS: ${DOCKER_DB_PASS:-root}
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-diplom_auth}
      AUTH_SESSION_MAX_AGE_SECONDS: ${AUTH_SESSION_MAX_AGE_SECONDS:-43200}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-diplom_csrf}
      LOGO_CACHE_TTL_SECONDS: ${LOGO_CACHE_TTL_SECONDS:-86400}
      LOGO_BATCH_MAX_IDS: ${LOGO_BATCH_MAX_IDS:-80}
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      DADATA_SECRET_KEY: ${DADATA_SECRET_KEY:-}
      DADATA_BASE_URL: ${DADATA_BASE_URL:-https://suggestions.dadata.ru/suggestions/api/4_1/rs}
      DADATA_QUERY_MAX_LENGTH: ${DADATA_QUERY_MAX_LENGTH:-300}
      DADATA_LOOKUP_TIMEOUT_SECONDS: ${DADATA_LOOKUP_TIMEOUT_SECONDS:-10}
      DADATA_REFRESH_INTERVAL_DAYS: ${DADATA_REFRESH_INTERVAL_DAYS:-30}
      DADATA_MAX_REQUESTS_PER_SECOND: ${DADATA_MAX_REQUESTS_PER_SECOND:-25}
      DADATA_FULL_REFRESH_REQUESTS_PER_SECOND: ${DADATA_FULL_REFRESH_REQUESTS_PER_SECOND:-20}
      DADATA_DAILY_REQUEST_LIMIT: ${DADATA_DAILY_REQUEST_LIMIT:-10000}
      DADATA_MAX_CONCURRENT_REQUESTS: ${DADATA_MAX_CONCURRENT_REQUESTS:-10}
      DADATA_MAX_NEW_CONNECTIONS_PER_MINUTE: ${DADATA_MAX_NEW_CONNECTIONS_PER_MINUTE:-50}
      DADATA_REFRESH_BATCH_SIZE: ${DADATA_REFRESH_BATCH_SIZE:-50}
      DADATA_FULL_REFRESH_CONCURRENCY: ${DADATA_FULL_REFRESH_CONCURRENCY:-10}
      DADATA_JOB_STATUS_TTL_SECONDS: ${DADATA_JOB_STATUS_TTL_SECONDS:-86400}
      DADATA_FULL_REFRESH_DAILY_LIMIT: ${DADATA_FULL_REFRESH_DAILY_LIMIT:-1}
      DADATA_FULL_REFRESH_LOCK_TTL_SECONDS: ${DADATA_FULL_REFRESH_LOCK_TTL_SECONDS:-900}
      DADATA_ALLOW_MANUAL_FULL_REFRESH_AFTER_SCHEDULED: ${DADATA_ALLOW_MANUAL_FULL_REFRESH_AFTER_SCHEDULED:-false}
      DADATA_DAILY_REQUEST_RESERVE: ${DADATA_DAILY_REQUEST_RESERVE:-200}
      DADATA_MAX_RETRIES: ${DADATA_MAX_RETRIES:-3}
      DADATA_RETRY_BASE_DELAY_SECONDS: ${DADATA_RETRY_BASE_DELAY_SECONDS:-0.5}
      DADATA_SCHEDULE_INITIAL_REFRESH: ${DADATA_SCHEDULE_INITIAL_REFRESH:-false}
      DADATA_FALLBACK_REQUESTS_PER_SECOND: ${DADATA_FALLBACK_REQUESTS_PER_SECOND:-3}
      DADATA_MAX_ACTIVE_MANUAL_JOBS_PER_USER: ${DADATA_MAX_ACTIVE_MANUAL_JOBS_PER_USER:-3}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  dadata-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: ${DADATA_WORKER_REPLICAS:-2}
    command: ["python", "-m", "src.app.scripts.dadata_worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DOCKER_DB_NAME:-tbl}
      DB_USER: root
      DB_PASS: ${DOCKER_DB_PASS:-root}
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-diplom_auth}
      AUTH_SESSION_MAX_AGE_SECONDS: ${AUTH_SESSION_MAX_AGE_SECONDS:-43200}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-diplom_csrf}
      LOGO_CACHE_TTL_SECONDS: ${LOGO_CACHE_TTL_SECONDS:-86400}
      LOGO_BATCH_MAX_IDS: ${LOGO_BATCH_MAX_IDS:-80}
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      DADATA_SECRET_KEY: ${DADATA_SECRET_KEY:-}
      DADATA_BASE_URL: ${DADATA_BASE_URL:-https://suggestions.dadata.ru/suggestions/api/4_1/rs}
      DADATA_QUERY_MAX_LENGTH: ${DADATA_QUERY_MAX_LENGTH:-300}
      DADATA_LOOKUP_TIMEOUT_SECONDS: ${DADATA_LOOKUP_TIMEOUT_SECONDS:-10}
      DADATA_REFRESH_INTERVAL_DAYS: ${DADATA_REFRESH_INTERVAL_DAYS:-30}
      DADATA_MAX_REQUESTS_PER_SECOND: ${DADATA_MAX_REQUESTS_PER_SECOND:-25}
      DADATA_FULL_REFRESH_REQUESTS_PER_SECOND: ${DADATA_FULL_REFRESH_REQUESTS_PER_SECOND:-20}
      DADATA_DAILY_REQUEST_LIMIT: ${DADATA_DAILY_REQUEST_LIMIT:-10000}
      DADATA_MAX_CONCURRENT_REQUESTS: ${DADATA_MAX_CONCURRENT_REQUESTS:-10}
      DADATA_MAX_NEW_CONNECTIONS_PER_MINUTE: ${DADATA_MAX_NEW_CONNECTIONS_PER_MINUTE:-50}
      DADATA_REFRESH_BATCH_SIZE: ${DADATA_REFRESH_BATCH_SIZE:-50}
      DADATA_FULL_REFRESH_CONCURRENCY: ${DADATA_FULL_REFRESH_CONCURRENCY:-10}
      DADATA_JOB_STATUS_TTL_SECONDS: ${DADATA_JOB_STATUS_TTL_SECONDS:-86400}
      DADATA_FULL_REFRESH_DAILY_LIMIT: ${DADATA_FULL_REFRESH_DAILY_LIMIT:-1}
      DADATA_FULL_REFRESH_LOCK_TTL_SECONDS: ${DADATA_FULL_REFRESH_LOCK_TTL_SECONDS:-900}
      DADATA_ALLOW_MANUAL_FULL_REFRESH_AFTER_SCHEDULED: ${DADATA_ALLOW_MANUAL_FULL_REFRESH_AFTER_SCHEDULED:-false}
      DADATA_DAILY_REQUEST_RESERVE: ${DADATA_DAILY_REQUEST_RESERVE:-200}
      DADATA_MAX_RETRIES: ${DADATA_MAX_RETRIES:-3}
      DADATA_RETRY_BASE_DELAY_SECONDS: ${DADATA_RETRY_BASE_DELAY_SECONDS:-0.5}
      DADATA_SCHEDULE_INITIAL_REFRESH: ${DADATA_SCHEDULE_INITIAL_REFRESH:-false}
      DADATA_FALLBACK_REQUESTS_PER_SECOND: ${DADATA_FALLBACK_REQUESTS_PER_SECOND:-3}
      DADATA_MAX_ACTIVE_MANUAL_JOBS_PER_USER: ${DADATA_MAX_ACTIVE_MANUAL_JOBS_PER_USER:-3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  mysql_data:
  redis_data:
